[mapper]
"Peptide" = "Sequence"
"Stripped Peptide" = "Peptide"
"z" = "Charge"
"Accession" = "Protein Group"
"Source File" = "Raw file"
"Q-Value" = "Q-Value"

[modifications_parser]
"parse_column" = "Sequence"
"before_aa" = false
"isalpha" = true
"isupper" = true
"pattern" = "(?<=\\().+?(?=\\))"
"modification_dict" = {"+57.02" = "Carbamidomethyl", "+15.99" = "Oxidation", "-17.026548" = "Gln->pyro-Glu", "-18.010565" = "Glu->pyro-Glu", "+42.01" = "Acetyl"}

[general]
"decoy_flag" = false

[run_mapper]
"LFQ_Astral_DIA_15min_50ng_Human_01" = "LFQ_Astral_DIA_15min_50ng_Human_01"
"LFQ_Astral_DIA_15min_50ng_Human_02" = "LFQ_Astral_DIA_15min_50ng_Human_02"
"LFQ_Astral_DIA_15min_50ng_Human_03" = "LFQ_Astral_DIA_15min_50ng_Human_03"

[upload_info]
"datapoint_file" = "dia_db.precursor.csv"
"datapoint_file_description" = "Upload the PEAKS `dia_db.precursor.csv` file from the DIA database search export. **Note that this is a different file than the one used for the quantification modules** (which use the LFQ feature table). PEAKS reports no q-value column, so ProteoBench derives one from the `-10LgP` score; check that the reported FDR threshold shown for your run matches the precursor FDR you set in the search."
"params_file" = "parameters.txt"
"params_file_description" = "Upload the PEAKS parameter export file (`parameters.txt`)."
