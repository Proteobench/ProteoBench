# InstaNovo v1.2.2 -- inference mode: diffusion_only
#
# Values below are the inference config this run actually resolved, taken from the
# run's own log, with container paths and machine-shaped knobs removed.
# Command: instanovo diffusion predict --denovo --no-refinement
#
# Added from outside the log: software_version (pip spec instanovo==1.2.2), residues
# (v1.2.2 vocabulary -- without it the parser falls back to residue_remapping keys,
# which are remap sources, not tokens), and the five spectrum-preprocessing values,
# which inference reads from the checkpoint's model config rather than this file.
#
# This run used InstaNovo+ alone (`instanovo diffusion predict --no-refinement`),
# starting the reverse process from a uniform sample. num_beams/use_knapsack/
# instanovo_model sat at their defaults in the resolved config but no transformer
# ran, so they are omitted here rather than reported as a five-beam search.

